[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "inverse-fiber-pinn"
version = "1.0.0"
description = "Reproducible computational optics study"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "scipy>=1.12", "torch>=2.2"]
[project.optional-dependencies]
test = ["pytest>=8"]
notebooks = ["ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
